# fantokens.brunopessoa.com  -> the gallery (all 13 screens side by side)
# ftapp.brunopessoa.com      -> the prototype full screen, for opening on a phone
map $host $ft_root {
    default "";
    ~^ftapp\. app;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    add_header Cache-Control "no-cache" always;
    location = / {
        try_files /$ft_root/index.html /index.html;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
